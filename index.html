<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator ~ by Ganit Technology</title>
  <meta name="description" content="A universal, privacy-first, offline-capable calculator platform. 45+ calculators across 18 categories. No tracking, no ads, no data collection." />
  <meta name="author" content="Ganit Technology — Powered by Dhurta Organisation" />

  <!-- Open Graph -->
  <meta property="og:title" content="Calculator ~ by Ganit Technology" />
  <meta property="og:description" content="Universal privacy-first calculator. 45+ tools, offline-first, no tracking." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/brand/ganit.png" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#00C4E8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ganit" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/brand/ganit.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self';" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/brand.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/rtl.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Calculator ~ by Ganit Technology",
    "description": "Universal privacy-first calculator platform with 45+ tools across 18 categories.",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any (browser-based)",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Organization", "name": "Ganit Technology", "parentOrganization": { "@type": "Organization", "name": "Dhurta Organisation" } }
  }
  </script>
</head>
<body>

  <!-- ===================================================
       SPLASH SCREEN
       =================================================== -->
  <div id="splash" class="splash" role="status" aria-label="Loading Ganit Calculator">
    <div class="splash-logo-wrap">
      <span class="splash-ring"></span>
      <span class="splash-ring-2"></span>
      <img
        src="assets/brand/ganit.png"
        alt="Ganit Technology Logo"
        class="splash-logo-img"
        draggable="false"
      />
    </div>
    <div class="splash-text">
      <h1 class="splash-title">Ganit <span>Calculator</span></h1>
      <p class="splash-sub">by Ganit Technology</p>
      <p class="splash-by">Powered by Dhurta Organisation · BETA v0.1.0</p>
    </div>
    <div class="splash-progress">
      <div class="splash-progress-bar"></div>
    </div>
  </div>

  <!-- ===================================================
       APP SHELL
       =================================================== -->
  <div id="app" class="app hidden" role="main">

    <!-- ── HEADER ─────────────────────────────────────── -->
    <header class="ganit-header" role="banner">

      <!-- Logo Zone (aligns with sidebar) -->
      <a href="#/" class="header-logo-zone" aria-label="Ganit Calculator — Home">
        <img
          src="assets/brand/ganit.png"
          alt="Ganit"
          class="header-logo-img"
          draggable="false"
        />
        <div class="header-logo-text">
          <span class="header-logo-name">Ganit Calculator</span>
          <span class="header-logo-sub">by Dhurta Organisation</span>
        </div>
      </a>

      <!-- Toolbar -->
      <div class="header-toolbar">

        <!-- Global search trigger -->
        <button
          id="header-search-btn"
          class="header-search"
          aria-label="Search calculators (Ctrl+K)"
          title="Search calculators"
        >
          <span class="header-search-icon">🔍</span>
          <span class="header-search-text">Search tools…</span>
          <span class="header-search-kbd">
            <kbd>Ctrl</kbd><kbd>K</kbd>
          </span>
        </button>

        <!-- Right-side actions -->
        <div class="header-right">
          <button id="header-history" class="header-action-btn" title="Toggle history (Ctrl+H)" aria-label="Toggle history">
            <span>📋</span>
            <span>History</span>
          </button>
          <button id="header-theme" class="header-icon-btn" title="Cycle theme" aria-label="Switch theme">
            🎨
          </button>
          <button id="header-sidebar-toggle" class="header-icon-btn" title="Toggle sidebar (Ctrl+/)" aria-label="Toggle sidebar" style="display:none">
            ☰
          </button>
        </div>
      </div>
    </header>

    <!-- ── SIDEBAR ─────────────────────────────────────── -->
    <div id="sidebar-container" role="navigation" aria-label="Calculator categories"></div>

    <!-- ── MAIN CONTENT ────────────────────────────────── -->
    <main class="ganit-main">
      <div id="main-content" role="region" aria-label="Calculator" tabindex="-1">
        <div class="loading" aria-live="polite" aria-label="Loading">
          <div class="loading-ring" aria-hidden="true"></div>
          <p>Loading…</p>
        </div>
      </div>
    </main>

    <!-- ── FOOTER ──────────────────────────────────────── -->
    <footer class="ganit-footer" role="contentinfo">
      <div class="footer-brand">
        <img
          src="assets/brand/ganit.png"
          alt="Ganit Technology"
          class="footer-logo"
          draggable="false"
        />
        <span>Calculator ~ by Ganit Technology</span>
      </div>

      <nav class="footer-links" aria-label="Footer links">
        <a href="#/about">About</a>
        <a href="#/privacy">Privacy</a>
        <a href="https://github.com/dhurta-org/ganit-calculator" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://dhurta.org" target="_blank" rel="noopener noreferrer">Dhurta.Org</a>
      </nav>

      <div class="footer-legal">
        <span>BETA v0.1.0 · MIT License</span><br/>
        <span>© 2024–2025 Dhurta Organisation &nbsp;·&nbsp; Zero tracking · Zero ads</span>
      </div>
    </footer>

  </div><!-- /app -->

  <!-- Web Components + App -->
  <script type="module" src="js/web-component.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
